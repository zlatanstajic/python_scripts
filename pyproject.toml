[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-scripts"
version = "1.0.0"
description = "Python utilities for CV generation and website screenshots"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Python Scripts Contributors" }]
keywords = ["automation", "scripts", "utilities", "tools", "productivity"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
  "Topic :: Utilities",
]

dependencies = [
  "Markdown>=3.5.0",
  "WeasyPrint>=60.0",
  "playwright>=1.62.0",
  "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
dev = [
  "black==24.3.0",
  "isort==5.13.2",
  "flake8==7.0.0",
  "bandit==1.7.5",
  "pytest==8.0.0",
  "pytest-cov==4.1.0",
  "mypy==1.10.0",
  "pydocstyle==6.3.0",
  "sphinx==7.2.6",
  "sphinx-rtd-theme==2.0.0",
  "sphinx-autodoc-typehints==1.25.2",
]

[project.urls]
Homepage = "https://github.com/zlatanstajic/python_scripts"
Documentation = "https://github.com/zlatanstajic/python_scripts/tree/master/docs"
Repository = "https://github.com/zlatanstajic/python_scripts"
Issues = "https://github.com/zlatanstajic/python_scripts/issues"

[project.scripts]
cv-generator = "scripts.cv_generator:main"
website-screenshot = "scripts.screenshot:main"

[tool.setuptools]
packages = ["scripts"]

[tool.black]
line-length = 88
target-version = ["py37", "py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
known_first_party = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--verbose --cov=scripts --cov-report=term-missing --cov-report=html"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["scripts"]
omit = ["*/tests/*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if 0:",
  "if False:",
]
precision = 2
show_missing = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
show_error_codes = true
no_implicit_optional = true
warn_no_return = true
strict_optional = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["dotenv"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".git"]
skips = []
severity = "high"
confidence = "high"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "E266", "E501", "W503"]
exclude = [
  ".git",
  "__pycache__",
  ".venv",
  ".pytest_cache",
  ".mypy_cache",
  "build",
  "dist",
  ".eggs",
]
per-file-ignores = ["__init__.py:F401"]

[tool.pydocstyle]
convention = "google"
add-ignore = ["D100", "D104"]
match = "(?!test_).*\\.py"
match-dir = "(?!tests)[^\\.].*"

[tool.pylint.messages_control]
disable = ["C0330", "C0326", "R0903", "R0913", "W0212"]

[tool.pylint.format]
max-line-length = 88
