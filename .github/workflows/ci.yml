name: CI - Code Quality & Testing

on:
  push:
    branches:
    - master
    - develop
    paths:
    - 'src/**'
    - 'scripts/**'
    - 'tests/**'
    - '*.toml'
    - '*.txt'
    - '.github/workflows/ci.yml'
  pull_request:
    branches:
    - master
    - develop
  workflow_dispatch:


jobs:
  quality:
    runs-on: ubuntu-latest
    name: Code Quality Checks
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"

    - name: Lint with flake8
      run: |
        python -m flake8 src/ scripts/

    - name: Check import sorting with isort
      run: |
        python -m isort . --profile black --check-only --diff

    - name: Check code formatting with black
      run: |
        python -m black . --check --diff

    - name: Type checking with mypy
      run: |
        python -m mypy src/ scripts/

    - name: Docstring validation with pydocstyle
      run: |
        python -m pydocstyle src/ scripts/

    - name: Security scanning with bandit
      run: |
        python -m bandit -r src/ scripts/ -ll
      continue-on-error: true

  tests:
    runs-on: ubuntu-latest
    name: Tests & Coverage
    strategy:
      matrix:
        python-version: [ '3.10', '3.11', '3.12' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -e ".[dev]"

    - name: Run tests with pytest
      run: |
        python -m pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
