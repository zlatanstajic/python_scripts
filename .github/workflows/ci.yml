name: CI - Code Quality & Testing

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Checks (Python ${{ matrix.python-version }})
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Verify console script entry points
        run: |
          cv-generator --help
          website-screenshot --help
          media-organizer --help

      - name: Run tests with pytest
        run: python -m pytest tests/ --cov-report=xml

      - name: Compile Python files
        run: python -m compileall -q scripts tests

      - name: Lint with flake8
        run: python -m flake8 scripts/

      - name: Type checking with mypy
        run: python -m mypy scripts/

      - name: Docstring validation with pydocstyle
        run: python -m pydocstyle scripts/

      - name: Security scanning with Bandit
        run: python -m bandit -r scripts/ -ll

      - name: Check import sorting with isort
        run: python -m isort . --profile black --check-only --diff

      - name: Check code formatting with Black
        run: python -m black . --check --diff

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
